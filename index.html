<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>天気アプリ</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f0f4f8;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* 横並び確実にする */
    #forecast {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .day {
      background: white;
      padding: 10px;
      border-radius: 8px;
      width: 90px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    img {
      display: block;
      margin: 5px auto;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>今日の天気</h2>
    <img id="weather-icon" width="100">
    <div id="weather"></div>
  </div>

  <h2>週間天気</h2>
  <div id="forecast"></div>

  <script>
    const apiKey = "53c7f49e01f46f614bb7c85c423ff578";
    const city = "Tokyo";

    // アイコン取得
    function getWeatherIcon(weatherMain) {
      switch (weatherMain) {
        case "Clear":
          return '<img src="images/sunny.png" width="ouds":
          return '<img src="images/cloudy.png" width="in":
        case "Drizzle":
          return '<img src="images/rain.png" width="50":
          return '<img src="images/snow.png" width="50derstorm":
          return '<img src="images/thunder.png" width="50         return '<img src="images/cloudy.png" width="50 // ✅ 今日の天気
    fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=ja`)
      .then(res => res.json())
      .then(data => {
        const weatherMain = data.weather[0].main;

        document.getElementById("weather").innerHTML = `
          <p>${data.name}</p>
          <p>${data.weather[0].description}</p>
          <p>${Math.round(data.main.temp)}℃</p>
        `;

        document.getElementById("weather-icon").src =
          getWeatherIcon(weatherMain).match(/src="(.*?)"/)[1];
      });

    // 週間データ整理（12時のみ）
    function getDailyForecast(list) {
      return list.filter(item =>
        item.dt_txt.includes("12:00:00")
      );
    }

    // 週間天気（DOMで確実に追加）
    fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric&lang=ja`)
      .then(res => res.json())
      .then(data => {

        const days = getDailyForecast(data.list);
        const forecastEl = document.getElementById("forecast");

        forecastEl.innerHTML = ""; // 初期化

        days.forEach(day => {
          const date = day.dt_txt.split(" ")[0].slice(5);
          const iconHTML = getWeatherIcon(day.weather[0].main);

          const div = document.createElement("div");
          div.className = "day";

          div.innerHTML = `
            <p>${date}</p>
            ${iconHTML}
            <p>${Math.round(day.main.temp)}℃</p>
          `;

          forecastEl.appendChild(div);
        });

      });
  </script>

</body>
</html>
