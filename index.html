<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天気アプリ</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #eef3f7;
  margin: 0;
}

/* ===== 今日カード ===== */
.today-card {
  width: 320px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
}

.content {
  position: relative;
  z-index: 2;
}

.big-icon {
  width: 120px;
}

/* ===== 週間 ===== */
#forecast {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px;
}

.day {
  background: white;
  padding: 12px;
  border-radius: 12px;
  width: 110px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.small-icon {
  width: 60px;
}

.temp {
  font-weight: bold;
}

/* ===== 雨エフェクト ===== */
.rain {
  position: absolute;
  inset: 0;
  display: none;
}

.rain::before {
  content: "";
  position: absolute;
  width: 2px;
  height: 200%;
  background: rgba(255,255,255,0.5);
  animation: rain 0.4s linear infinite;
}

@keyframes rain {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100%); }
}
</style>
</head>

<body>

<h2>今日の天気</h2>

<div id="today-card" class="today-card">
  <div class="overlay"></div>
  <div class="rain" id="rain"></div>

  <div class="content">
    <p id="today-date"></p>
    <img id="weather-icon" class="big-icon">
    <div id="weather"></div>
  </div>
</div>

<h2>週間天気</h2>
<div id="forecast"></div>

<script>
const apiKey = "53c7f49e01f46f614bb7c85c423ff578";
const city = "Tokyo";

/* ===== 日付 ===== */
function formatDate(dateStr){
  const d = new Date(dateStr);
  const w = ["日","月","火","水","木","金","土"];
  return (d.getMonth()+1)+"月"+d.getDate()+"日("+w[d.getDay()]+")";
}

/* ===== アイコン ===== */
function getIcon(w){
  if(w==="Clear") return "images/sunny.png";
  if(w==="Clouds") return "images/cloudy.png";
  if(w==="Rain"||w==="Drizzle") return "images/rain.png";
  if(w==="Snow") return "images/snow.png";
  return "images/cloudy.png";
}

/* ===== 背景 ===== */
function setBackground(w){
  let bg="";
  if(w==="Clear") bg="images/bg-clear.jpg";
  else if(w==="Clouds") bg="images/bg-cloud.jpg";
  else bg="images/bg-rain.jpg";

  const card = document.getElementById("today-card");
  card.style.backgroundImage = "url("+bg+")";
  card.style.backgroundSize="cover";
}

/* ===== 雨 ===== */
function setRain(w){
  const el=document.getElementById("rain");
  el.style.display=(w==="Rain"||w==="Drizzle")?"block":"none";
}

/* ===== 温度色 ===== */
function tempColor(t){
  if(t>=30)return "red";
  if(t>=20)return "orange";
  if(t>=10)return "blue";
  return "lightblue";
}

/* ===== 今日 ===== */
fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=ja`)
.then(r=>r.json())
.then(d=>{

  setBackground(d.weather[0].main);
  setRain(d.weather[0].main);

  document.getElementById("today-date").innerText =
    formatDate(new Date());

  document.getElementById("weather-icon").src =
    getIcon(d.weather[0].main);

  document.getElementById("weather").innerHTML =
    `${d.name}<br>${d.weather[0].description}<br>
     <b>${Math.round(d.main.temp)}℃</b><br>
     湿度 ${d.main.humidity}%<br>
     風 ${d.wind.speed}m/s`;
});

/* ===== 週間 ===== */
fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric&lang=ja`)
.then(r=>r.json())
.then(d=>{

  const map={};

  d.list.forEach(i=>{
    const date=i.dt_txt.split(" ")[0];

    if(!map[date]){
      map[date]={temps:[],weather:i.weather[0].main};
    }
    map[date].temps.push(i.main.temp);
  });

  const days=Object.keys(map).slice(0,5);

  const el=document.getElementById("forecast");
  el.innerHTML="";

  days.forEach(date=>{
    const temps=map[date].temps;

    const max=Math.max(...temps);
    const min=Math.min(...temps);

    const div=document.createElement("div");
    div.className="day";

    div.innerHTML=
      `<div>${formatDate(date)}</div>
       <img src="${getIcon(map[date].weather)}" class="small">
       <span style="color:${tempColor(max)}">${Math.round(max)}℃</span>
       /
       <span style="color:${tempColor(min)}">${Math.round(min)}℃</span>
       </div>`;

    el.appendChild(div);
  });

});
</script>

</body>
</html>
