<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>天気アプリ</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 0;
  background-image: url("images/bg-main.jpg");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

h2 {
  color: white;
  text-shadow: 0 3px 10px rgba(0,0,0,0.9);
  margin-top: 30px;
}

/* ===== 今日カード ===== */
.today-card {
  width: 320px;
  height: 320px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
}

/* ✅ 日付（右上） */
.today-date {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 14px;
}

/* ✅ アイコン（中央） */
.today-icon {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
}

/* ✅ 天気 + 温度（左寄せ中央） */
.today-main {
  position: absolute;
  bottom: 20px;
  left: 20px;
  text-align: left;
}

/* ✅ 温度だけ大きく */
.today-temp {
  font-size: 36px;
  font-weight: bold;
  margin-top: 5px;
}

/* ✅ 湿度・風（右下・薄く） */
.today-sub {
  position: absolute;
  bottom: 20px;
  right: 20px;
  text-align: right;
  font-size: 13px;
  opacity: 0.7;
}

/* ✅ 更新時間 */
.update-time {
  position: absolute;
  bottom: 5px;
  right: 20px;
  font-size: 11px;
  opacity: 0.6;
}

/* ===== 週間 ===== */
#forecast {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px;
}

.day {
  background: rgba(255,255,255,0.92);
  padding: 12px;
  border-radius: 12px;
  width: 120px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.small-icon {
  width: 60px;
  height: 60px;
  object-fit: contain;
}

.temp {
  font-weight: bold;
  white-space: nowrap;
}
</style>
</head>

<body>

<h2>今日の天気</h2>

<div id="today-card" class="today-card">
  <div class="overlay"></div>

  <div id="today-date" class="today-date"></div>
  <img id="weather-icon" class="today-icon">

  <div id="today-main" class="today-main"></div>
  <div id="today-sub" class="today-sub"></div>
  <div id="update-time" class="update-time"></div>
</div>

<h2>週間天気</h2>
<div id="forecast"></div>

<script>
const apiKey = "53c7f49e01f46f614bb7c85c423ff578";
const city = "Tokyo";

/* 日付 */
function formatDate(dateStr){
  const d = new Date(dateStr);
  const w = ["日","月","火","水","木","金","土"];
  return (d.getMonth()+1)+"月"+d.getDate()+"日("+w[d.getDay()]+")";
}

/* アイコン */
function getIcon(w){
  if(w==="Clear") return "images/sunny.png";
  if(w==="Clouds") return "images/cloudy.png";
  if(w==="Rain"||w==="Drizzle") return "images/rain.png";
  if(w==="Snow") return "images/snow.png";
  return "images/cloudy.png";
}

/* 背景 */
function setBackground(weatherMain){
  let bg = "";

  if(weatherMain === "Clear") {
    bg = "images/bg-clear.jpg";
  } else if(weatherMain === "Clouds") {
    bg = "images/bg-cloud.jpg";
  } else if(weatherMain === "Rain" || weatherMain === "Drizzle") {
    bg = "images/bg-rain.jpg";
  } else {
    bg = "images/bg-cloud.jpg";
  }

/* 更新時間取得 */
function getUpdateTime() {
  const now = new Date();

  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');

  return h + ":" + m + " 更新";
}

  const card = document.getElementById("today-card");

  card.style.backgroundImage = "url(" + bg + ")";
  card.style.backgroundSize = "cover";
  card.style.backgroundPosition = "center";
}

/* 今日 */
fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=ja`)
.then(r=>r.json())
.then(d=>{

  // ✅ 背景変更
  setBackground(d.weather[0].main);

  document.getElementById("today-date").innerText =
    "東京都" + formatDate(new Date());

  document.getElementById("weather-icon").src =
    getIcon(d.weather[0].main);

  /* ✅ 曇りがち + 温度 */
  document.getElementById("today-main").innerHTML =
    `${d.weather[0].description}
     <div class="today-temp">${Math.round(d.main.temp)}℃</div>`;

  /* ✅ 湿度・風（右下） */
  document.getElementById("today-sub").innerHTML =
    `湿度 ${d.main.humidity}%<br>
     風 ${d.wind.speed}m/s`;

  /* ✅ 更新時間（右下） */
　document.getElementById("update-time").innerText =
  　getUpdateTime();
});

/* ===== 週間 ===== */
fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}&units=metric&lang=ja`)
.then(r=>r.json())
.then(d=>{

  const map={};

  d.list.forEach(i=>{
    const date=i.dt_txt.split(" ")[0];
    if(!map[date]){
      map[date]={temps:[],weather:i.weather[0].main};
    }
    map[date].temps.push(i.main.temp);
  });

  const days=Object.keys(map).slice(0,5);
  const el=document.getElementById("forecast");

  el.innerHTML="";

  days.forEach(date=>{
    const temps=map[date].temps;
    const max=Math.max(...temps);
    const min=Math.min(...temps);

    const div=document.createElement("div");
    div.className="day";

    div.innerHTML =
      `<div>${formatDate(date)}</div>
       <img src="${getIcon(map[date].weather)}" class="small"></img>
       <div class="temp">
         <span style="color:orange">${Math.round(max)}℃</span> /
         <span style="color:blue"}>${Math.round(min)}℃</span>
       </div>`;

    el.appendChild(div);
  });
});
</script>

</body>
</html>
``
